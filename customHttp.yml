# Cabeceras para Amplify Hosting (mismas de seguridad que pagina 2 + caché).
# Sin Content-Security-Policy a propósito: el sitio cargará etiquetas de Google
# y una CSP mal ajustada las bloquea sin mostrar ningún error.
customHeaders:
  - pattern: '**'
    headers:
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000'
      - key: 'X-Frame-Options'
        value: 'SAMEORIGIN'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'X-XSS-Protection'
        value: '1; mode=block'
  # Imágenes: no cambian de nombre, caché de 1 año.
  - pattern: 'images/**'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  # CSS y JS se versionan con ?v=N en el HTML; al cambiarlos, sube el número.
  - pattern: '**/*.css'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '**/*.js'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: 'favicon.svg'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=604800'
